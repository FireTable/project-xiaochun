# Cloudflare Pages 配置 — Project XiaoChun
#
# 本地预览构建产物:
#   pnpm build           # 输出到 dist/
#   pnpm wrangler pages dev dist    # 本地 Pages 模拟器(可选)
#
# 部署方式(任选其一):
#   A. Git 集成:推 GitHub → Cloudflare Dashboard 连仓库 → 自动构建
#   B. CLI:      pnpm wrangler pages deploy dist
#
# ⚠️ functions/api/tts.ts 使用 response.webSocket(Cloudflare Workers 自 2023 起支持),
#    因此 compatibility_date 选用较新的 2024-09-23,避免老 runtime 行为差异。

name = "project-xiaochun"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"
