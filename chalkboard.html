<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Project XiaoChun · 交互手绘黑板演示台</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    :root {
      --board-bg: #18261e;
      --wood-dark: #3a2215;
      --wood-mid: #543420;
      --wood-light: #73482d;
      --chalk-white: #f8fafc;
      --chalk-yellow: #fef08a;
      --chalk-pink: #fca5a5;
      --chalk-cyan: #7dd3fc;
      --chalk-green: #86efac;
      --chalk-orange: #fdba74;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0f1512;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    /* 整体黑板外框 */
    #app-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      background: var(--wood-dark);
      border: 12px solid var(--wood-mid);
      border-image: linear-gradient(135deg, var(--wood-light) 0%, var(--wood-mid) 50%, var(--wood-dark) 100%) 12;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.8), 0 20px 60px rgba(0, 0, 0, 0.9);
    }

    /* 黑板画布区 (铺满全屏) */
    #chalkboard-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      cursor: crosshair;
      background: 
        radial-gradient(circle at 50% 40%, rgba(40, 70, 55, 0.25) 0%, transparent 70%),
        radial-gradient(circle at 20% 80%, rgba(30, 50, 40, 0.35) 0%, transparent 60%),
        repeating-linear-gradient(45deg, rgba(255,255,255,0.003) 0px, rgba(255,255,255,0.003) 2px, transparent 2px, transparent 6px),
        var(--board-bg);
      box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.6);
    }

    #chalk-canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    /* 右侧伴侣嵌入窗：透明背景、无边框、无多余按钮 */
    #embed-wrapper {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 33.333vw;
      height: 66.666vh;
      min-width: 300px;
      min-height: 400px;
      z-index: 20;
      display: flex;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      border-radius: 0 !important;
      overflow: visible;
      pointer-events: auto;
    }

    /* iframe 主视口：纯透明、无框、无背景 */
    #xiaochun-frame {
      width: 100%;
      height: 100%;
      border: none !important;
      background: transparent !important;
      pointer-events: auto;
    }

    /* 顶部极简粉笔标题 (低调精致，不喧宾夺主) */
    #top-bar {
      position: absolute;
      top: 14px;
      left: 20px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
    }

    .chalk-title {
      font-family: "Bradley Hand", "Comic Sans MS", "Chalkboard", "PingFang SC", sans-serif;
      font-size: 18px;
      font-weight: 800;
      color: var(--chalk-yellow);
      text-shadow: 0 0 3px rgba(254, 240, 138, 0.3), 1px 1px 1px rgba(0,0,0,0.8);
      letter-spacing: 1px;
    }

    /* 底部粉笔槽工具条 (Chalk Tray) */
    #chalk-tray {
      position: absolute;
      bottom: 12px;
      left: 20px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(180deg, rgba(45, 28, 17, 0.95), rgba(28, 17, 10, 0.98));
      border: 2px solid var(--wood-light);
      border-radius: 12px;
      padding: 6px 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7), inset 0 2px 4px rgba(255, 255, 255, 0.15);
    }

    .tray-group {
      display: flex;
      align-items: center;
      gap: 6px;
      border-right: 1px solid rgba(255, 255, 255, 0.12);
      padding-right: 8px;
    }

    .tray-group:last-child {
      border-right: none;
      padding-right: 0;
    }

    .tool-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e2e8f0;
      padding: 5px 9px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
    }

    .tool-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.3);
      color: #ffffff;
      transform: translateY(-1px);
    }

    .tool-btn.active {
      background: rgba(243, 208, 154, 0.25);
      border-color: #f3d09a;
      color: #fef08a;
      box-shadow: 0 0 10px rgba(243, 208, 154, 0.35);
    }

    /* 粉笔颜色块 */
    .chalk-stick {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid rgba(0, 0, 0, 0.4);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .chalk-stick:hover {
      transform: scale(1.18);
    }

    .chalk-stick.active {
      transform: scale(1.25);
      border-color: #ffffff;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
    }

    /* 粗细选择器 */
    .brush-size-btn {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .brush-size-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .brush-size-btn.active {
      border-color: #f3d09a;
      background: rgba(243, 208, 154, 0.2);
    }

    .brush-dot {
      background: #ffffff;
      border-radius: 50%;
    }

    /* 提示 Toast */
    #chalk-toast {
      position: absolute;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      background: rgba(20, 26, 23, 0.9);
      border: 1px solid rgba(243, 208, 154, 0.4);
      color: #fef08a;
      font-size: 12px;
      padding: 5px 14px;
      border-radius: 20px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s, transform 0.25s;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    #chalk-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(4px);
    }
  </style>
</head>
<body>
  <div id="app-container">
    <!-- 1. 左侧及全局底板：黑板画板 -->
    <div id="chalkboard-container">
      <canvas id="chalk-canvas"></canvas>
    </div>

    <!-- 顶部状态栏 -->
    <div id="top-bar">
      <div class="chalk-title">
        <span>✏️ 72h 架构讲演手绘黑板</span>
      </div>
    </div>

    <!-- 2. 底部粉笔槽 (Chalk Tray) -->
    <div id="chalk-tray">
      <!-- 笔刷模式 -->
      <div class="tray-group">
        <button id="tool-pen" class="tool-btn active" title="粉笔手绘 (P)">✏️ 粉笔</button>
        <button id="tool-arrow" class="tool-btn" title="手绘箭头 (A)">➡️ 箭头</button>
        <button id="tool-line" class="tool-btn" title="直线 (L)">📏 直线</button>
        <button id="tool-rect" class="tool-btn" title="流程方框 (R)">⬜ 方框</button>
        <button id="tool-circle" class="tool-btn" title="重点圈 (C)">⭕ 重点圈</button>
        <button id="tool-eraser" class="tool-btn" title="粉笔擦 (E)">🧽 板擦</button>
      </div>

      <!-- 颜色选择 -->
      <div class="tray-group">
        <div class="chalk-stick active" data-color="#f8fafc" style="background: var(--chalk-white);" title="白色粉笔"></div>
        <div class="chalk-stick" data-color="#fef08a" style="background: var(--chalk-yellow);" title="黄色粉笔"></div>
        <div class="chalk-stick" data-color="#fca5a5" style="background: var(--chalk-pink);" title="粉色粉笔"></div>
        <div class="chalk-stick" data-color="#7dd3fc" style="background: var(--chalk-cyan);" title="天青粉笔"></div>
        <div class="chalk-stick" data-color="#86efac" style="background: var(--chalk-green);" title="草绿粉笔"></div>
        <div class="chalk-stick" data-color="#fdba74" style="background: var(--chalk-orange);" title="暖橙粉笔"></div>
      </div>

      <!-- 粗细选择 -->
      <div class="tray-group">
        <div class="brush-size-btn" data-size="3" title="细笔 (3px)"><div class="brush-dot" style="width: 4px; height: 4px;"></div></div>
        <div class="brush-size-btn active" data-size="6" title="中粉笔 (6px)"><div class="brush-dot" style="width: 8px; height: 8px;"></div></div>
        <div class="brush-size-btn" data-size="14" title="粗粉笔 (14px)"><div class="brush-dot" style="width: 14px; height: 14px;"></div></div>
      </div>

      <!-- 撤销 / 清空 / 截图 -->
      <div class="tray-group">
        <button id="btn-undo" class="tool-btn" title="撤销 (Cmd/Ctrl+Z)">↩️ 撤销</button>
        <button id="btn-clear" class="tool-btn" title="全黑板擦净">🧹 擦净黑板</button>
        <button id="btn-save" class="tool-btn" title="导出画板截图">📷 存图</button>
      </div>
    </div>

    <!-- 3. 右侧伴侣嵌入窗：透明背景、无边框、无按钮、融入黑板 -->
    <div id="embed-wrapper">
      <iframe 
        id="xiaochun-frame" 
        src=""
        allow="microphone; camera; display-capture; autoplay; clipboard-write;"
        allowtransparency="true"
      ></iframe>
    </div>

    <!-- 提示框 -->
    <div id="chalk-toast"></div>
  </div>

  <script>
    // ═══════════════════════════════════════════════════════════════
    // 1. 动态确定嵌入源：优先使用本地源，支持 transparent 透明场景
    // ═══════════════════════════════════════════════════════════════
    const iframe = document.getElementById('xiaochun-frame');
    const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
    
    // 优先加载本地透明源 (/embed?scene=transparent&transparent=1)
    if (isLocal) {
      iframe.src = '/embed?scene=transparent&transparent=1';
    } else if (window.location.protocol === 'file:') {
      // 本地 file:// 打开时尝试直连本地 https://localhost:5185 服务
      iframe.src = 'https://localhost:5185/embed?scene=transparent&transparent=1';
    } else {
      // 线上环境访问线上透明源
      iframe.src = 'https://xiaochun-dev.firetable.tech/embed?scene=transparent&transparent=1';
    }

    // ═══════════════════════════════════════════════════════════════
    // 2. 黑板画布绘制引擎 (粉笔微颗粒感 + 矢量图元 + 撤销历史)
    // ═══════════════════════════════════════════════════════════════
    const canvas = document.getElementById('chalk-canvas');
    const ctx = canvas.getContext('2d');
    const toast = document.getElementById('chalk-toast');

    let currentTool = 'pen'; // 'pen' | 'arrow' | 'line' | 'rect' | 'circle' | 'eraser'
    let currentColor = '#f8fafc';
    let currentSize = 6;
    let isDrawing = false;
    let startX = 0;
    let startY = 0;
    let lastX = 0;
    let lastY = 0;

    // 撤销堆栈 (最大 30 步快照)
    const undoStack = [];
    const MAX_UNDO = 30;

    function showToast(msg) {
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function saveUndoSnapshot() {
      if (undoStack.length >= MAX_UNDO) undoStack.shift();
      undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    }

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      
      let temp = null;
      if (canvas.width > 0 && canvas.height > 0) {
        temp = document.createElement('canvas');
        temp.width = canvas.width;
        temp.height = canvas.height;
        temp.getContext('2d').drawImage(canvas, 0, 0);
      }

      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);

      if (temp) {
        ctx.drawImage(temp, 0, 0, rect.width, rect.height);
      } else {
        drawInitialChalkboardArt();
      }
    }

    // 绘制真实粉笔摩擦颗粒
    function drawChalkSegment(x1, y1, x2, y2, color, size, isEraser = false) {
      if (isEraser) {
        ctx.save();
        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath();
        ctx.arc(x2, y2, size * 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        return;
      }

      ctx.save();
      const dist = Math.hypot(x2 - x1, y2 - y1);
      const steps = Math.max(1, Math.floor(dist / 2));
      
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const cx = x1 + (x2 - x1) * t;
        const cy = y1 + (y2 - y1) * t;
        
        const density = Math.max(3, Math.floor(size * 1.5));
        for (let j = 0; j < density; j++) {
          const angle = Math.random() * Math.PI * 2;
          const r = (Math.random() ** 1.5) * (size / 1.5);
          const px = cx + Math.cos(angle) * r;
          const py = cy + Math.sin(angle) * r;
          const alpha = 0.25 + Math.random() * 0.55;

          ctx.fillStyle = color;
          ctx.globalAlpha = alpha;
          const dotSize = 0.8 + Math.random() * 1.4;
          ctx.fillRect(px, py, dotSize, dotSize);
        }
      }
      ctx.restore();
    }

    // 绘制手绘箭头
    function drawChalkArrow(x1, y1, x2, y2, color, size) {
      const headLength = Math.max(16, size * 3.5);
      const dx = x2 - x1;
      const dy = y2 - y1;
      const angle = Math.atan2(dy, dx);
      
      drawChalkSegment(x1, y1, x2, y2, color, size);
      
      const leftX = x2 - headLength * Math.cos(angle - Math.PI / 6);
      const leftY = y2 - headLength * Math.sin(angle - Math.PI / 6);
      const rightX = x2 - headLength * Math.cos(angle + Math.PI / 6);
      const rightY = y2 - headLength * Math.sin(angle + Math.PI / 6);
      
      drawChalkSegment(x2, y2, leftX, leftY, color, size);
      drawChalkSegment(x2, y2, rightX, rightY, color, size);
    }

    // 绘制方框
    function drawChalkRect(x1, y1, x2, y2, color, size) {
      drawChalkSegment(x1, y1, x2, y1, color, size);
      drawChalkSegment(x2, y1, x2, y2, color, size);
      drawChalkSegment(x2, y2, x1, y2, color, size);
      drawChalkSegment(x1, y2, x1, y1, color, size);
    }

    // 绘制圆圈
    function drawChalkCircle(x1, y1, x2, y2, color, size) {
      const rx = Math.abs(x2 - x1) / 2;
      const ry = Math.abs(y2 - y1) / 2;
      const cx = (x1 + x2) / 2;
      const cy = (y1 + y2) / 2;
      const steps = 36;
      let prevX = cx + rx;
      let prevY = cy;

      for (let i = 1; i <= steps; i++) {
        const theta = (i / steps) * Math.PI * 2;
        const curX = cx + Math.cos(theta) * rx;
        const curY = cy + Math.sin(theta) * ry;
        drawChalkSegment(prevX, prevY, curX, curY, color, size);
        prevX = curX;
        prevY = curY;
      }
    }

    // 预置黑板板书提示
    function drawInitialChalkboardArt() {
      saveUndoSnapshot();
      ctx.save();
      ctx.fillStyle = '#fef08a';
      ctx.font = 'bold 22px "Chalkboard", "Bradley Hand", -apple-system, sans-serif';
      ctx.fillText('📋 72h 实时互动架构演进 · 讲演黑板', 36, 80);
      
      ctx.fillStyle = '#f8fafc';
      ctx.font = '15px -apple-system, sans-serif';
      ctx.fillText('1. 全双工 VAD 实时打断机制 (Silero VAD + Barge-in 声学门控)', 36, 120);
      ctx.fillText('2. 独立倾听状态机 (Single Bone Writer 单骨骼写锁 + 0.75s 平滑)', 36, 150);
      ctx.fillText('3. 电影级结构化导演协议 (Shot, Movement, Expression, Camera, Grading)', 36, 180);
      ctx.fillText('4. 纯端侧零依赖推理 (WebLLM + SenseVoice 本地 STT + EMAGE)', 36, 210);

      ctx.fillStyle = '#fdba74';
      ctx.fillText('👉 右侧小蠢为透明伴侣 (无边框·直接融入黑板)', 36, 260);
      ctx.restore();
    }

    // 画布坐标转换
    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    let tempSnapshot = null;

    function onPointerDown(e) {
      if (e.button !== 0 && !e.touches) return;
      saveUndoSnapshot();
      isDrawing = true;
      // 绘图时让 iframe 不捕获鼠标，允许用户手绘线条或箭头跨入右侧区域
      iframe.style.pointerEvents = 'none';

      const pos = getCanvasCoords(e);
      startX = pos.x;
      startY = pos.y;
      lastX = pos.x;
      lastY = pos.y;

      if (currentTool !== 'pen' && currentTool !== 'eraser') {
        tempSnapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
      }
    }

    function onPointerMove(e) {
      if (!isDrawing) return;
      const pos = getCanvasCoords(e);

      if (currentTool === 'pen') {
        drawChalkSegment(lastX, lastY, pos.x, pos.y, currentColor, currentSize);
        lastX = pos.x;
        lastY = pos.y;
      } else if (currentTool === 'eraser') {
        drawChalkSegment(lastX, lastY, pos.x, pos.y, currentColor, currentSize, true);
        lastX = pos.x;
        lastY = pos.y;
      } else if (tempSnapshot) {
        ctx.putImageData(tempSnapshot, 0, 0);
        if (currentTool === 'line') {
          drawChalkSegment(startX, startY, pos.x, pos.y, currentColor, currentSize);
        } else if (currentTool === 'arrow') {
          drawChalkArrow(startX, startY, pos.x, pos.y, currentColor, currentSize);
        } else if (currentTool === 'rect') {
          drawChalkRect(startX, startY, pos.x, pos.y, currentColor, currentSize);
        } else if (currentTool === 'circle') {
          drawChalkCircle(startX, startY, pos.x, pos.y, currentColor, currentSize);
        }
      }
    }

    function onPointerUp(e) {
      if (!isDrawing) return;
      isDrawing = false;
      tempSnapshot = null;
      // 释放绘图后恢复 iframe 互动响应
      iframe.style.pointerEvents = 'auto';
    }

    canvas.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    canvas.addEventListener('touchstart', onPointerDown, { passive: false });
    window.addEventListener('touchmove', onPointerMove, { passive: false });
    window.addEventListener('touchend', onPointerUp);

    // 撤销
    function undo() {
      if (undoStack.length === 0) {
        showToast('已经是最初状态啦');
        return;
      }
      const last = undoStack.pop();
      ctx.putImageData(last, 0, 0);
      showToast('已撤销一步');
    }

    // 工具栏绑定
    const toolButtons = {
      pen: document.getElementById('tool-pen'),
      arrow: document.getElementById('tool-arrow'),
      line: document.getElementById('tool-line'),
      rect: document.getElementById('tool-rect'),
      circle: document.getElementById('tool-circle'),
      eraser: document.getElementById('tool-eraser')
    };

    Object.keys(toolButtons).forEach((toolKey) => {
      const btn = toolButtons[toolKey];
      btn.addEventListener('click', () => {
        Object.values(toolButtons).forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTool = toolKey;
        showToast(`切换为: ${btn.innerText}`);
      });
    });

    // 颜色切换
    document.querySelectorAll('.chalk-stick').forEach((stick) => {
      stick.addEventListener('click', () => {
        document.querySelectorAll('.chalk-stick').forEach(s => s.classList.remove('active'));
        stick.classList.add('active');
        currentColor = stick.dataset.color;
        if (currentTool === 'eraser') {
          toolButtons.pen.click();
        }
      });
    });

    // 粗细切换
    document.querySelectorAll('.brush-size-btn').forEach((sizeBtn) => {
      sizeBtn.addEventListener('click', () => {
        document.querySelectorAll('.brush-size-btn').forEach(b => b.classList.remove('active'));
        sizeBtn.classList.add('active');
        currentSize = parseInt(sizeBtn.dataset.size, 10);
      });
    });

    document.getElementById('btn-undo').addEventListener('click', undo);
    
    document.getElementById('btn-clear').addEventListener('click', () => {
      saveUndoSnapshot();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      showToast('黑板已擦净');
    });

    document.getElementById('btn-save').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = `xiaochun-chalkboard-${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
      showToast('黑板画板截图已导出');
    });

    // 快捷键支持
    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
        e.preventDefault();
        undo();
      } else if (e.key.toLowerCase() === 'p') toolButtons.pen.click();
      else if (e.key.toLowerCase() === 'a') toolButtons.arrow.click();
      else if (e.key.toLowerCase() === 'e') toolButtons.eraser.click();
    });

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
  </script>
</body>
</html>
