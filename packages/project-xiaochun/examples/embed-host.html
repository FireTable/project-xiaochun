<!doctype html>
<!--
  最小宿主页 (手动验证用)。
  1. 起主应用:      pnpm dev            # https://localhost:5185  (自签证书, 浏览器先打开一次并信任)
  2. 构建 SDK:      pnpm --filter @firetable/project-xiaochun build
  3. 起静态服务:    npx serve packages/project-xiaochun -l 8080     # 或 python3 -m http.server 8080 -d packages/project-xiaochun
  4. 打开:          http://localhost:8080/examples/embed-host.html
     可选 ?src=https://localhost:5185/embed  覆盖 iframe 地址 (默认就是它); 线上用默认官方地址即可。
  5. 验证跨源隔离 / EMAGE 多线程 (可选开关 crossOriginIsolated):
        node packages/project-xiaochun/examples/serve-isolated.mjs      # 带 COOP: same-origin + COEP: credentialless 的静态服务, 默认 :8081
        打开 http://localhost:8081/examples/embed-host.html?isolated=1  # ?isolated=1 → SDK 选项 crossOriginIsolated:true / 标签 cross-origin-isolated
     日志第一行打印宿主 crossOriginIsolated; handshake 日志里 capabilities.crossOriginIsolated 应为 true (iframe 内);
  6. 换装 / 换场景 (阶段 3): 右侧 "outfit" 下拉由 getOutfits() 生成 (不含裸模), "scene" 三个按钮调 setScene。
        - 快速连点 outfit 下拉 / 按钮: 日志里先到的会 ok, 被顶掉的出现 [busy] (正常), 最后一次一定生效; 说话时换装不会打断说话。
        - "scene: transparent" 后鼠标移到空白处应穿透到本页 (点得到下面的文字), 移到角色身上才接收事件; 切回 light/dark 后整块 iframe 都接收事件。
        - 悬浮头像是 <xiaochun-avatar>: 它的两个按钮改的是 outfit / scene **属性** (热更新, 不重建 iframe)。
  7. 手势 (拖动 / 角落缩放): 面板里的 draggable / resizable 复选框 = xc.setDraggable(on) / xc.setResizable(on) (运行时开关, 不重建 iframe);
     也可用 URL 参数 ?draggable=1&resizable=1 一开始就开 (默认都关)。
        - draggable: 左键按住角色拖 = 移动整个 iframe (不压在内置按钮上); 夹在视口内。右下角 "box" 一行实时显示 left/top/width/height。
        - resizable: 鼠标移到 iframe 四个角 (40px 热区) 出现圆弧 + 缩放光标, 拖动 = 缩放 (对角固定; 最小 120x180, 最大 = 视口; 缩放不会重建 iframe)。
        - 透明场景 (scene: transparent) 下: 只有点在角色身上 / 角落热区上才接管手势, 其余位置仍穿透到本页。
        - 日志里能看到 move / resize 事件 (phase: start|move|end 与最新 left/top/width/height); 都不勾时拖动 / 拉角没有任何效果。
        - 圆角: 非透明场景 (light / dark) 默认 20px 圆角 (与 Tauri 桌宠窗口同值), 透明场景 0; 面板滑块 = xc.setBorderRadius(px), URL ?radius=0 = 方角。缩放时半径不变形。
        - 悬浮头像 (<xiaochun-avatar>) 同步带 draggable (+ ?resizable=1 时带 resizable 属性)。
     内置按钮 (ui 部件名数组): 面板里的 ui 复选框 = xc.setConfig({ ui: [...] }) 热切换 iframe 里的 chat / bubble / outfit / scene / lang / github 部件;
        也可用 URL 参数 ?ui=outfit,scene,lang,github 一开始就显示 (逗号分隔, 未知项被忽略并 warn; 不写 = 都不显示)。
        - 勾上 outfit / scene 后, iframe 右上角出现换装 / 换场景按钮 (和主站 TopHeader 同一套组件)。点选后日志里能看到 outfit-changed / scene-changed,
          用面板上的 setOutfit / 场景按钮换装时, 按钮里的 ✓ 和加载状态同步。
        - scene: transparent 时点按钮不会穿透到本页, 空白处仍穿透; iframe 自己的 localStorage 会记住偏好 (刷新后恢复, 显式 ?outfit= / ?scene= 优先); 宿主想另存可见脚本里 outfit-changed 的 localStorage 示例, 或 ?persist=host。
     显示策略 uiAutoHide (面板里的下拉 = xc.setConfig({ uiAutoHide }), URL ?uiAutoHide=transparent|true|false): 默认 'transparent' 与 Tauri 桌宠一致 ——
        只有透明场景下按钮 / 聊天栏初始隐藏、单击角色才出现 (再点角色或空白收起, 10 秒无操作自动收起), 亮 / 暗场景一直显示; true = 所有场景点击才出现; false = 一直显示。
        拖动 iframe (draggable) 不算单击。
        - lang 按钮: 菜单选语言, 立即生效并存进 iframe 自己的 localStorage (优先级: URL ?lang= > 记住的 > 浏览器语言), 日志里能看到 lang-changed; github 按钮在新标签页打开项目仓库。
     滚轮: iframe 默认放开滚轮缩放 (controls 默认开)。透明场景只在指针落在角色上才缩放, 其余位置滚动本页 (页面故意撑高 160vh 方便验证);
        不透明场景 (light / dark) 在 iframe 区域内滚轮 = 缩放、不滚本页。URL 参数 ?controls=0 → SDK controls:false 锁定。
     URL 参数: ?outfit=xiaochun_maid  ?scene=dark  ?ui=outfit,scene,lang,github  ?uiAutoHide=false  ?lang=en  ?controls=0  ?cameraFov=40&cameraDistance=3&cameraHeight=0.2&cameraIntro=0 (相机, 面板里的滑条 = xc.setConfig({ camera }))  ?persistBox=1 (记住拖动 / 缩放后的位置和大小到本页 localStorage 'xiaochun:box:demo', 刷新后恢复; 面板里的 clearPersistedBox 按钮清除并复位)  ?persist=host (偏好存本页 localStorage 'xiaochun:prefs', 刷新后恢复)
               ?prefetch=1&heavy=eager (加载完后台预取服装到 IndexedDB, 不含婚纱; 日志里能看到 prefetch 进度)  ?custom=1 (allowCustomModel, 才允许下面的自定义 URL 框)
     点 heavy=eager 或 say 后, DevDrawer / worker 'wasm_env' 里 numThreads > 1。不带 ?isolated=1 (或用 :8080 的普通服务) 则为 false / 单线程。
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XiaoChun embed host demo</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; margin: 0; padding: 24px; background: linear-gradient(#fff4f2, #fff); min-height: 160vh; }
    h1 { font-size: 18px; margin: 0 0 12px; }
    .row { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; }
    .panel { max-width: 420px; }
    button, input, select { font: inherit; padding: 6px 10px; margin: 2px 2px 2px 0; }
    pre { background: #111; color: #9fe; padding: 10px; border-radius: 8px; height: 220px; overflow: auto; font-size: 12px; }
    /* 预留固定宽高: 占位 → iframe 不会引起布局抖动 (CLS) */
    #stage { width: 320px; height: 480px; border: 1px dashed #ea8377; border-radius: 12px; }
  </style>
</head>
<body>
  <h1>Project XiaoChun — iframe embed demo</h1>
  <div class="row">
    <div id="stage"></div>
    <div class="panel">
      <div>
        <input id="text" value="你好呀，我是小蠢！" size="22">
        <button id="say">say</button>
        <button id="chat" title="走 WebLLM, 会触发大模型下载">say(chat)</button>
      </div>
      <div>
        <button id="think">motion: thinking</button>
        <button id="stopMotion">stop motion</button>
        <select id="expr"><option>happy</option><option>sad</option><option>angry</option><option>surprised</option><option>relaxed</option><option>neutral</option></select>
        <button id="exprBtn">expression</button>
      </div>
      <div>
        outfit: <select id="outfit"><option>(握手后加载)</option></select>
        <button id="setOutfit">setOutfit</button>
        <button id="spam" title="连发 5 个 setOutfit: 中间的应收到 [busy], 最后一个生效">连点 ×5</button>
        <button id="prefetch" title="预取全部服装 (不含婚纱) 到 IndexedDB">prefetch()</button>
      </div>
      <div>
        scene: <span id="scenes"></span>
        <span id="cur" style="color:#888"></span>
      </div>
      <div id="uiParts" title="ui 部件名数组 -> xc.setConfig({ ui }); 不勾 = 都不显示">
        ui:
        <label><input type="checkbox" value="chat"> chat</label>
        <label><input type="checkbox" value="bubble"> bubble</label>
        <label><input type="checkbox" value="outfit"> outfit</label>
        <label><input type="checkbox" value="scene"> scene</label>
        <label><input type="checkbox" value="lang"> lang</label>
        <label><input type="checkbox" value="github"> github</label>
        <select id="uiAutoHide" title="uiAutoHide -> xc.setConfig({ uiAutoHide }): transparent(默认, 与 Tauri 一致) / true(所有场景点击才出现) / false(常显)">
          <option value="transparent">uiAutoHide: transparent</option>
          <option value="true">uiAutoHide: true</option>
          <option value="false">uiAutoHide: false</option>
        </select>
        <label style="margin-left:8px"><input type="checkbox" id="floatUi"> 悬浮头像也显示 outfit,scene</label>
      </div>
      <div class="row" id="cameraRow" title="camera -> xc.setConfig({ camera }): 立刻重新取景并取消进行中的推镜头; 重置 = null 恢复默认">
        <label>fov <input type="range" id="camFov" min="15" max="60" step="1" value="30"></label>
        <label>distance <input type="range" id="camDist" min="1" max="15" step="0.1" value="2.5"></label>
        <label>height <input type="range" id="camHeight" min="-1" max="1" step="0.05" value="0"></label>
        <button id="camReset">camera 重置</button>
      </div>
      <div>
        <input id="customUrl" placeholder="https://…/x.vrm (需 ?custom=1)" size="26">
        <button id="model" title="setModel({ url }): 默认被 SDK 拒绝, ?custom=1 才放行">setModel(url)</button>
        <button id="lookAt" title="协议已预留, /embed 暂返回 unsupported">lookAt (unsupported)</button>
      </div>
      <div id="gestures" title="draggable: 拖角色 = 移动 iframe; resizable: 拖四角缩放 (默认都关; URL ?draggable=1&resizable=1)">
        手势:
        <label><input type="checkbox" id="gDrag"> draggable</label>
        <label><input type="checkbox" id="gResize"> resizable</label>
        <button id="gSize" title="setSize(): 程序化改尺寸 (不重建 iframe)">setSize 240x360</button>
        <button id="gClear" title="clearPersistedBox({ reset: true }): 清掉 ?persistBox=1 存的位置 / 大小并复位">clearPersistedBox</button>
        <span id="box" style="color:#888"></span>
      </div>
      <div title="borderRadius: 非透明场景默认 20px (与 Tauri 窗口圆角同值), 透明 0; URL ?radius=0|12|32">
        圆角:
        <input id="radius" type="range" min="0" max="60" value="20" style="vertical-align:middle">
        <span id="radiusVal" style="color:#888">默认</span>
        <button id="radiusReset" title="setBorderRadius(undefined): 恢复默认">默认</button>
      </div>
      <div>
        float:
        <select id="floatOutfit"></select>
        <button id="floatScene" title="改 <xiaochun-avatar> 的 scene 属性 (热更新)">scene 属性: 下一个</button>
      </div>
      <div>
        <button id="mic">mic on/off</button>
        <button id="pause">pause</button>
        <button id="resume">resume</button>
        <button id="eager" title="立即预热 WebLLM + EMAGE">heavy=eager</button>
        <button id="destroy">destroy</button>
      </div>
      <pre id="log"></pre>
    </div>
  </div>
  <p>向下滚动: 右下角有一个透明、可拖动的悬浮头像 (&lt;xiaochun-avatar&gt;)。滚出视口会自动 pause。</p>

  <script src="../dist/loader.global.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const src = params.get('src') || 'https://localhost:5185/embed';
    // 悬浮头像: <xiaochun-avatar> 的 src 要在插入 DOM 前设好, 免得创建后又重建
    const f = document.createElement('xiaochun-avatar');
    f.id = 'float';
    f.setAttribute('src', src);
    f.setAttribute('position', 'bottom-right');
    f.setAttribute('size', '260');
    const isolated = params.get('isolated') === '1';
    if (isolated) f.setAttribute('cross-origin-isolated', '');
    f.setAttribute('transparent', '');
    f.setAttribute('scene', 'transparent');
    f.setAttribute('draggable', '');
    if (params.get('resizable') === '1') f.setAttribute('resizable', '');
    document.body.appendChild(f);

    const $ = (id) => document.getElementById(id);
    const log = (...a) => { const el = document.getElementById('log'); el.textContent += a.map(x => typeof x === 'string' ? x : JSON.stringify(x)).join(' ') + '\n'; el.scrollTop = 1e9; };

    log('host crossOriginIsolated =', String(window.crossOriginIsolated), '| option crossOriginIsolated =', String(isolated));
    const uiFromUrl = (params.get('ui') || '').split(',').map((x) => x.trim()).filter(Boolean);
    const xc = Xiaochun.createXiaochun({
      container: '#stage',
      src,
      lazy: 'idle',        // 进入视口 + 空闲后才创建 iframe; 改成 'click' 则点占位图才加载, false 则立即
      ...(params.get('persistBox') === '1' ? {} : { width: 320, height: 480 }), // persistBox 时不传尺寸: 用户缩放后的大小才会被恢复 (显式 width/height 优先于已保存的)
      transparent: false,
      lang: params.get('lang') || undefined,       // 'zh-CN' | 'en' | 'ja'; 不写 = iframe 记住的(用户在语言按钮里选的) > 浏览器语言
      outfit: params.get('outfit') || undefined,   // 初始服装 id; 非法/未知 → 回退默认 + error{unknown_id}
      scene: params.get('scene') || undefined,     // 'light' | 'dark' | 'transparent' | 'beach3d'
      persist: params.get('persist') || false,     // 'host' | 自定义 key | false (默认, 宿主不另存)
      ui: uiFromUrl,                               // 内置界面部件名数组, 例 ['outfit','scene','lang','github']; 不写 = 都不显示
      uiAutoHide: params.has('uiAutoHide') ? ({ true: true, false: false }[params.get('uiAutoHide')] ?? 'transparent') : undefined, // 默认 'transparent' = 与 Tauri 一致
      camera: Object.fromEntries([['fov', 'cameraFov'], ['distance', 'cameraDistance'], ['height', 'cameraHeight']].filter(([, q]) => params.has(q)).map(([k, q]) => [k, Number(params.get(q))]).concat(params.has('cameraIntro') ? [['intro', params.get('cameraIntro') !== '0']] : [])), // 相机 { fov 15-60, distance 1-15, height ±1, intro }; 不写 = 不覆盖
      persistBox: params.get('persistBox') === '1' ? 'demo' : undefined, // 记住位置 + 大小 (宿主 localStorage 'xiaochun:box:demo'); 显式 width/height 优先于已保存的大小, 所以示例里要看到大小恢复请去掉 width/height
      draggable: params.get('draggable') === '1',  // 手势拖动 (拖角色 = 移动 iframe); 默认关, 面板复选框可运行时切换
      resizable: params.get('resizable') === '1',  // 拖四角缩放; 默认关
      borderRadius: params.has('radius') ? Number(params.get('radius')) : undefined, // 外壳圆角: 默认 非透明 20px / 透明 0; ?radius=0 方角
      controls: params.get('controls') !== '0',    // 滚轮缩放, 默认开; ?controls=0 锁定
      allowCustomModel: params.get('custom') === '1',
      heavy: params.get('heavy') || 'lazy',
      prefetch: params.get('prefetch') === '1',    // 只在 heavy=eager 时自动预取
      crossOriginIsolated: isolated, // ?isolated=1 → iframe allow 追加 cross-origin-isolated (宿主需 COOP/COEP, 见 serve-isolated.mjs)
    });
    let lastPhaseLog = '';
    for (const ev of ['handshake', 'ready', 'progress', 'state', 'stt', 'utterance', 'hit-region', 'outfit-changed', 'scene-changed', 'lang-changed', 'move', 'resize', 'error', 'destroy']) {
      xc.on(ev, (p) => {
        if (ev === 'hit-region') return;
        if (ev === 'move' || ev === 'resize') { // 手势事件很密: 只在 start / end 打日志, 过程只刷新 box 读数
          $('box').textContent = ' box: ' + Math.round(p.left) + ',' + Math.round(p.top) + ' ' + Math.round(p.width) + 'x' + Math.round(p.height);
          if (p.phase === 'move') return;
        }
        if (ev === 'progress') { // 只在阶段/目标变化或到 100% 时打一行, 免得刷屏
          const k = p.phase + ':' + (p.id || '');
          if (k !== lastPhaseLog || p.progress >= 100) { lastPhaseLog = k; log('progress', p); }
          return;
        }
        log(ev, p ?? '');
      });
    }
    const refreshCur = () => { $('cur').textContent = ' now: outfit=' + xc.outfit + ' scene=' + xc.scene; };
    xc.on('outfit-changed', refreshCur); xc.on('scene-changed', refreshCur);
    // 握手后用 getOutfits()/getScenes() 生成控件 (旧版 /embed 返回 [] → 控件为空, 方法会 reject [unsupported])
    xc.on('handshake', async () => {
      const outfits = await xc.getOutfits(), scenes = await xc.getScenes();
      for (const sel of [$('outfit'), $('floatOutfit')]) sel.innerHTML = outfits.map((o) => `<option value="${o.id}">${o.name}</option>`).join('');
      $('scenes').innerHTML = scenes.map((s) => `<button data-scene="${s.id}">${s.id}${s.transparent ? ' (透明)' : ''}</button>`).join('');
      for (const b of $('scenes').querySelectorAll('button')) b.onclick = () => wrap(xc.setScene(b.dataset.scene));
      refreshCur();
    });
    xc.ready.then(() => log('== ready: model loaded =='), () => {});
    // iframe 已用自己的 localStorage 记住偏好; 这里演示宿主另存一份 (可选): 用户在内置按钮里选的服装 / 场景会以 outfit-changed / scene-changed 事件到这里
    xc.on('outfit-changed', (p) => { if (!p.initial) localStorage.setItem('demo:outfit', p.id); });
    xc.on('scene-changed', (p) => { if (!p.initial) localStorage.setItem('demo:scene', p.id); });

    // 手势开关 (运行时, 不重建 iframe)
    $('gDrag').checked = params.get('draggable') === '1';
    $('gResize').checked = params.get('resizable') === '1';
    $('gDrag').onchange = () => xc.setDraggable($('gDrag').checked);
    $('gResize').onchange = () => xc.setResizable($('gResize').checked);
    $('radius').oninput = () => { xc.setBorderRadius(Number($('radius').value)); $('radiusVal').textContent = $('radius').value + 'px'; };
    $('radiusReset').onclick = () => { xc.setBorderRadius(undefined); $('radiusVal').textContent = '默认'; };
    $('gClear').onclick = () => { xc.clearPersistedBox({ reset: true }); $('box').textContent = ' box: ' + JSON.stringify(xc.getBox()); };
    $('gSize').onclick = () => { xc.setSize(240, 360); $('box').textContent = ' box: ' + JSON.stringify(xc.getBox()); };

    // ui 复选框 <-> 部件名数组
    const uiBoxes = [...document.querySelectorAll('#uiParts input[value]')];
    for (const b of uiBoxes) b.checked = uiFromUrl.includes(b.value);
    for (const b of uiBoxes) b.onchange = () => wrap(xc.setConfig({ ui: uiBoxes.filter((x) => x.checked).map((x) => x.value) }));
    $('uiAutoHide').value = params.get('uiAutoHide') === 'true' || params.get('uiAutoHide') === 'false' ? params.get('uiAutoHide') : 'transparent';
    $('uiAutoHide').onchange = () => { const v = $('uiAutoHide').value; wrap(xc.setConfig({ uiAutoHide: v === 'transparent' ? v : v === 'true' })); };
    for (const [id, key] of [['camFov', 'fov'], ['camDist', 'distance'], ['camHeight', 'height']]) $(id).oninput = () => wrap(xc.setConfig({ camera: { [key]: Number($(id).value) } }));
    $('camReset').onclick = () => { wrap(xc.setConfig({ camera: { fov: null, distance: null, height: null } })); $('camFov').value = 30; $('camDist').value = 2.5; $('camHeight').value = 0; };
    $('floatUi').onchange = () => { // <xiaochun-avatar ui="outfit,scene"> (创建期属性: 改它会重建悬浮头像的 iframe)
      if ($('floatUi').checked) f.setAttribute('ui', 'outfit,scene'); else f.removeAttribute('ui');
    };

    const wrap = (p) => p.catch((e) => log('! ' + e.message));
    $('say').onclick = () => wrap(xc.say($('text').value));
    $('chat').onclick = () => wrap(xc.say($('text').value, { mode: 'chat' }));
    $('think').onclick = () => wrap(xc.motion('thinking'));
    $('stopMotion').onclick = () => wrap(xc.motion({ stop: true }));
    $('exprBtn').onclick = () => wrap(xc.expression($('expr').value));
    $('setOutfit').onclick = () => wrap(xc.setOutfit($('outfit').value));
    $('spam').onclick = () => { // 先到的跑, 排队中被更新的顶掉 → [busy]; 最后一个赢
      const ids = [...$('outfit').options].map((o) => o.value).filter((v) => v !== 'xiaochun_wedding');
      for (let i = 0; i < 5; i++) wrap(xc.setOutfit(ids[Math.floor(Math.random() * ids.length)]));
    };
    $('prefetch').onclick = () => wrap(xc.prefetch().then((r) => log('prefetched', r)));
    $('model').onclick = () => wrap(xc.setModel({ url: $('customUrl').value }));
    $('floatOutfit').onchange = () => f.setAttribute('outfit', $('floatOutfit').value);
    const sceneCycle = ['light', 'dark', 'beach3d', 'transparent'];
    $('floatScene').onclick = () => f.setAttribute('scene', sceneCycle[(sceneCycle.indexOf(f.getAttribute('scene')) + 1) % sceneCycle.length]);
    $('lookAt').onclick = () => wrap(xc.lookAt(0.5, 0));
    let micOn = false;
    $('mic').onclick = () => { micOn = !micOn; wrap(xc.mic(micOn)); };
    $('pause').onclick = () => xc.pause();
    $('resume').onclick = () => xc.resume();
    $('eager').onclick = () => wrap(xc.setConfig({ heavy: 'eager' }));
    $('destroy').onclick = () => xc.destroy();

    for (const n of ['xc-ready', 'xc-error', 'xc-utterance', 'xc-outfit-changed', 'xc-scene-changed']) f.addEventListener(n, (e) => log('<float> ' + n, e.detail));
  </script>
</body>
</html>
