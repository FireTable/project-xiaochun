<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小蠢 AI 伴侣·设置</title>
    <style>
      :root {
        --primary: #ea8377;
        --primary-light: #f5aa9c;
        --primary-dark: #e06d64;
        --primary-gradient: linear-gradient(
          135deg,
          #f5aa9c 0%,
          #ea8377 50%,
          #e06d64 100%
        );
        --primary-glow: rgba(234, 131, 119, 0.4);
        --bg: #08090f;
        --surface: rgba(19, 17, 28, 0.96);
        --surface-card: rgba(28, 25, 40, 0.85);
        --surface-card-hover: rgba(38, 33, 54, 0.95);
        --surface-card-active: rgba(234, 131, 119, 0.12);
        --border: rgba(234, 131, 119, 0.22);
        --border-active: #ea8377;
        --text: #f3f4f6;
        --text-muted: #9ca3af;
        --success: #34d399;
        --warning: #fbbf24;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        font-size: 13px;
        line-height: 1.5;
        padding: 24px 28px;
        user-select: none;
        -webkit-font-smoothing: antialiased;
      }

      .header {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 24px;
        padding-bottom: 18px;
        border-bottom: 1px solid var(--border);
      }

      .logo-img {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        box-shadow: 0 4px 16px var(--primary-glow);
        border: 1px solid var(--border);
        object-fit: cover;
      }

      .header-text h1 {
        font-size: 17px;
        font-weight: 700;
        color: #fff;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .header-text p {
        font-size: 12.5px;
        color: var(--text-muted);
        margin-top: 2px;
      }

      .section-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--primary-light);
        margin-bottom: 12px;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }

      .mode-cards {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 24px;
      }

      .mode-card {
        position: relative;
        display: flex;
        align-items: flex-start;
        gap: 14px;
        padding: 16px 18px;
        border-radius: 14px;
        background: var(--surface-card);
        border: 1.5px solid var(--border);
        cursor: pointer;
        transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .mode-card:hover {
        background: var(--surface-card-hover);
        border-color: rgba(234, 131, 119, 0.45);
        transform: translateY(-1px);
      }

      .mode-card.active {
        background: var(--surface-card-active);
        border-color: var(--border-active);
        box-shadow: 0 0 20px var(--primary-glow);
      }

      .mode-card.disabled {
        opacity: 0.55;
        cursor: not-allowed;
        filter: grayscale(0.5);
      }

      .mode-card.disabled:hover {
        border-color: var(--border);
        transform: none;
        box-shadow: none;
      }

      .radio-circle {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 2px solid var(--text-muted);
        margin-top: 2px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: all 0.2s ease;
      }

      .mode-card.active .radio-circle {
        border-color: var(--primary);
        background: var(--primary);
      }

      .radio-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #fff;
        display: none;
      }

      .mode-card.active .radio-dot {
        display: block;
      }

      .mode-info {
        flex: 1;
      }

      .mode-header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 4px;
      }

      .mode-name {
        font-size: 14px;
        font-weight: 600;
        color: #fff;
      }

      .badge {
        font-size: 10.5px;
        font-weight: 600;
        padding: 2px 7px;
        border-radius: 9999px;
        letter-spacing: 0.02em;
      }

      .badge-primary {
        background: rgba(234, 131, 119, 0.18);
        color: var(--primary-light);
        border: 1px solid rgba(234, 131, 119, 0.35);
      }

      .badge-gray {
        background: rgba(255, 255, 255, 0.08);
        color: var(--text-muted);
      }

      .mode-desc {
        font-size: 12px;
        color: var(--text-muted);
        line-height: 1.45;
      }

      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 28px;
        padding-top: 18px;
        border-top: 1px solid var(--border);
      }

      .save-btn {
        appearance: none;
        background: var(--primary-gradient);
        border: none;
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        padding: 8px 26px;
        border-radius: 9999px;
        cursor: pointer;
        box-shadow: 0 4px 14px var(--primary-glow);
        transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .save-btn:hover {
        transform: scale(1.03);
        filter: brightness(1.08);
        box-shadow: 0 6px 18px var(--primary-glow);
      }

      .save-btn:active {
        transform: scale(0.97);
      }

      .repo-card {
        margin-top: 20px;
        padding: 12px 16px;
        border-radius: 12px;
        background: rgba(28, 25, 40, 0.6);
        border: 1px dashed rgba(234, 131, 119, 0.25);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .repo-info {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }

      .repo-title {
        font-size: 12px;
        font-weight: 600;
        color: #fff;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .repo-meta {
        font-size: 11px;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .repo-meta strong {
        color: var(--primary-light);
        font-weight: 500;
      }

      .repo-links {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }

      .link-btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11.5px;
        font-weight: 500;
        color: var(--primary-light);
        background: rgba(234, 131, 119, 0.1);
        border: 1px solid rgba(234, 131, 119, 0.28);
        padding: 4px 10px;
        border-radius: 8px;
        text-decoration: none;
        transition: all 0.2s ease;
      }

      .link-btn:hover {
        background: rgba(234, 131, 119, 0.2);
        border-color: var(--primary);
        color: #fff;
        transform: translateY(-1px);
      }

      .toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: rgba(19, 17, 28, 0.96);
        border: 1px solid var(--primary);
        box-shadow:
          0 10px 28px rgba(0, 0, 0, 0.6),
          0 0 16px var(--primary-glow);
        padding: 8px 18px;
        border-radius: 9999px;
        font-size: 12px;
        color: #fff;
        display: flex;
        align-items: center;
        gap: 8px;
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        z-index: 100;
      }

      .toast.show {
        opacity: 1;
        visibility: visible;
        transform: translateX(-50%) translateY(0);
      }
    </style>
  </head>
  <body>
    <div class="header">
      <img src="assets/icon.png" alt="小蠢" class="logo-img" />
      <div class="header-text">
        <h1 id="header-title">小蠢 AI 伴侣 设置</h1>
        <p id="header-desc">选择虚拟形象的呈现形态与常驻运行模式</p>
      </div>
    </div>

    <div class="section-title" id="section-title">运行形态配置</div>

    <div class="mode-cards">
      <!-- 选项 1: 内嵌伴侣视窗 (默认) -->
      <div class="mode-card active" id="card-embed" data-mode="embed">
        <div class="radio-circle">
          <div class="radio-dot"></div>
        </div>
        <div class="mode-info">
          <div class="mode-header">
            <span class="mode-name" id="mode-name-embed">Cindy 内嵌伴侣视窗</span>
            <span class="badge badge-gray" id="badge-embed-noinstall">免安装 · 开箱即用</span>
          </div>
          <div class="mode-desc" id="mode-desc-embed">
            直接在 Cindy 侧边栏/主视窗中渲染伴侣视窗，支持实时伴读、肢体动作、服装切换与面部表情。开箱即用，0
            门槛免安装。
          </div>
        </div>
      </div>

    </div>

    <!-- 开源来源与项目信息 -->
    <div class="repo-card">
      <div class="repo-info">
        <div class="repo-title">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" style="opacity: 0.9;">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
          </svg>
          <span id="repo-title-text">Project XiaoChun · 开源来源声明</span>
        </div>
        <div class="repo-meta">
          <span id="repo-author-text">作者：<strong>FireTable</strong></span>
          <span>·</span>
          <span id="repo-license-text">协议：<strong>MIT</strong></span>
          <span>·</span>
          <span id="repo-version-text">版本：<strong>v1.0.0</strong></span>
        </div>
      </div>
      <div class="repo-links">
        <a href="https://github.com/FireTable/project-xiaochun" target="_blank" rel="noopener noreferrer" class="link-btn" id="repo-link-github">
          GitHub 仓库
        </a>
        <a href="https://xiaochun.firetable.tech" target="_blank" rel="noopener noreferrer" class="link-btn" id="repo-link-official">
          官方主页
        </a>
      </div>
    </div>

    <div class="footer">
      <span style="font-size: 11.5px; color: var(--text-muted)" id="footer-security-text">
        ✨ 小蠢作为原生 3D AI 伴侣轻量常驻 Cindy 侧边栏，开箱即用。
      </span>
      <button type="button" class="save-btn" id="btn-save">保存设置</button>
    </div>

    <!-- 浮动提示 Toast -->
    <div class="toast" id="toast">✅ 设置已成功保存！</div>

    <script src="settings.js"></script>
  </body>
</html>
