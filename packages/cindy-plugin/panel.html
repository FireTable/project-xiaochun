<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小蠢 AI 伴侣</title>
  <style>
    :root {
      --bg: #0f1117;
      --text: #f0f3f8;
      --text-muted: #8b949e;
      --primary: #ec4899;
      --primary-rgb: 236, 72, 153;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --text: #0f172a;
        --text-muted: #64748b;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--text);
    }

    #app-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* 3D 伴侣嵌入 iframe：100% 沉浸全屏 */
    #xiaochun-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: transparent;
    }

    /* 宿主超时重试遮罩 (默认穿透，全权由 iframe 内原生 LoadingOverlay 呈现启动视觉) */
    #loading-overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: transparent;
      pointer-events: none;
    }

    #loading-overlay.hidden {
      display: none;
    }

    .retry-btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(15, 17, 23, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--text);
      padding: 8px 18px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: none;
      pointer-events: auto;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      transition: all 0.2s ease;
    }

    .retry-btn:hover {
      background: rgba(var(--primary-rgb), 0.2);
      border-color: var(--primary);
      color: #fff;
    }

    .retry-btn.show {
      display: inline-block;
    }
  </style>
</head>
<body>
  <div id="app-container">
    <!-- 失败超时重试挂件（仅在加载超时时唤出） -->
    <div id="loading-overlay" class="hidden">
      <button class="retry-btn" id="btn-retry">🔄 重新连接小蠢 AI 伴侣</button>
    </div>

    <!-- 小蠢 AI 伴侣 iframe 嵌入 -->
    <iframe
      id="xiaochun-frame"
      allow="autoplay; microphone"
      sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-downloads"
      loading="eager"
    ></iframe>
  </div>

  <script src="panel.js"></script>
</body>
</html>
