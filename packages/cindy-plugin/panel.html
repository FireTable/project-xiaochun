<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">小蠢 AI 伴侣</title>
  <style>
    :root {
      /* Project XiaoChun 官方深空背景体系 */
      --bg: #08090f;
      --surface: rgba(19, 17, 28, 0.82);
      --surface-focus: rgba(26, 23, 38, 0.94);
      --border: rgba(255, 255, 255, 0.12);
      --border-highlight: rgba(255, 255, 255, 0.2);
      --text: #f8fafc;
      --text-muted: rgba(248, 250, 252, 0.55);
      --text-sub: rgba(248, 250, 252, 0.38);

      /* Project XiaoChun 官方品牌与语义色彩 (暖杏桃粉) */
      --primary: #ea8377;
      --primary-light: #f5aa9c;
      --primary-dark: #e06d64;
      --primary-highlight: #fce0d4;
      --primary-rgb: 234, 131, 119;
      --primary-glow: rgba(234, 131, 119, 0.35);
      --primary-gradient: linear-gradient(135deg, #f5aa9c 0%, #ea8377 50%, #e06d64 100%);
      --primary-gradient-subtle: linear-gradient(135deg, rgba(234, 131, 119, 0.2) 0%, rgba(224, 109, 100, 0.25) 100%);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --surface: rgba(255, 255, 255, 0.88);
        --surface-focus: rgba(255, 255, 255, 0.98);
        --border: rgba(0, 0, 0, 0.08);
        --border-highlight: rgba(234, 131, 119, 0.3);
        --text: #0f172a;
        --text-muted: #64748b;
        --text-sub: #94a3b8;
        --primary-glow: rgba(234, 131, 119, 0.22);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #app-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* 伴侣视窗嵌入 iframe：100% 沉浸全屏 */
    #xiaochun-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: transparent;
    }

    /* 宿主超时重试遮罩 (默认穿透，全权由 iframe 内原生 LoadingOverlay 呈现启动视觉) */
    #loading-overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: transparent;
      pointer-events: none;
    }

    #loading-overlay.hidden {
      display: none;
    }

    .retry-btn {
      appearance: none;
      border: 1px solid rgba(234, 131, 119, 0.4);
      background: rgba(19, 17, 28, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: var(--text);
      padding: 8px 20px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: none;
      pointer-events: auto;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), 0 0 16px rgba(234, 131, 119, 0.2);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .retry-btn:hover {
      background: rgba(234, 131, 119, 0.18);
      border-color: var(--primary);
      color: #fff;
      transform: scale(1.04);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45), 0 0 20px var(--primary-glow);
    }

    .retry-btn.show {
      display: inline-block;
    }

    /* 伴侣视窗悬浮毛玻璃对话栏 (平滑浮现) */
    .chat-bar-container {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(28px);
      width: calc(100% - 32px);
      max-width: 540px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                  visibility 0.5s;
    }

    /* 当伴侣场景与引擎完全就绪后激活浮现 */
    .chat-bar-container.ready {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    /* 快捷建议/提示药丸 (专属伙伴引导) */
    .tip-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(19, 17, 28, 0.92);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(234, 131, 119, 0.35);
      box-shadow: 0 10px 28px -4px rgba(0, 0, 0, 0.45), 0 0 16px rgba(234, 131, 119, 0.18);
      font-size: 12px;
      color: var(--text);
      animation: tipFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      transition: all 0.25s ease;
    }

    @media (prefers-color-scheme: light) {
      .tip-pill {
        background: rgba(255, 255, 255, 0.94);
        border-color: rgba(234, 131, 119, 0.45);
        box-shadow: 0 10px 24px -4px rgba(0, 0, 0, 0.1), 0 0 16px rgba(234, 131, 119, 0.2);
      }
    }

    @keyframes tipFadeIn {
      from { opacity: 0; transform: translateY(8px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .tip-pill.hidden {
      display: none !important;
    }

    .tip-icon {
      font-size: 13px;
      color: var(--primary-light);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      animation: pulse 2.4s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 6px var(--primary)); }
    }

    .tip-text {
      color: var(--text);
      font-weight: 500;
      letter-spacing: 0.01em;
    }

    .tip-action-btn {
      appearance: none;
      background: var(--primary-gradient);
      border: none;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 3.5px 12px;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(234, 131, 119, 0.38);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      letter-spacing: 0.02em;
    }

    .tip-action-btn:hover {
      filter: brightness(1.08);
      transform: scale(1.05);
      box-shadow: 0 4px 14px rgba(234, 131, 119, 0.52);
    }

    .tip-action-btn:active {
      transform: scale(0.96);
    }

    .tip-close-btn {
      appearance: none;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 14px;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s ease;
    }

    .tip-close-btn:hover {
      color: var(--primary-light);
    }

    /* 毛玻璃输入表单 — Project XiaoChun 原生质感 */
    .chat-form {
      width: 100%;
      min-height: 48px;
      display: flex;
      align-items: center;
      background: var(--surface);
      backdrop-filter: blur(24px) saturate(190%);
      -webkit-backdrop-filter: blur(24px) saturate(190%);
      border: 1px solid var(--border);
      box-shadow: 0 16px 40px -8px rgba(0, 0, 0, 0.5), inset 0 1px 1px 0 rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
      padding: 5px 6px 5px 18px;
      gap: 8px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @media (prefers-color-scheme: light) {
      .chat-form {
        background: var(--surface);
        border: 1px solid var(--border);
        box-shadow: 0 14px 36px -8px rgba(0, 0, 0, 0.12), inset 0 1px 1px 0 rgba(255, 255, 255, 0.6);
      }
    }

    .chat-form:focus-within {
      border-color: var(--primary);
      box-shadow: 0 20px 48px -6px rgba(0, 0, 0, 0.6),
                  0 0 0 2px rgba(234, 131, 119, 0.28),
                  0 0 24px var(--primary-glow);
      background: var(--surface-focus);
    }

    @media (prefers-color-scheme: light) {
      .chat-form:focus-within {
        background: var(--surface-focus);
        box-shadow: 0 16px 40px -6px rgba(234, 131, 119, 0.2),
                    0 0 0 2px rgba(234, 131, 119, 0.25);
      }
    }

    .chat-input {
      flex: 1;
      height: 38px;
      background: transparent;
      border: none;
      outline: none;
      font-size: 13.5px;
      font-weight: 450;
      color: var(--text);
      font-family: inherit;
      min-width: 0;
    }

    .chat-input::placeholder {
      color: var(--text-muted);
      opacity: 0.75;
      font-size: 13px;
    }

    /* 发送按钮 — 暖杏桃色渐变与微交互 */
    .btn-send {
      width: 36px;
      height: 36px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      flex-shrink: 0;
    }

    /* 输入有内容时或处于 active 状态时点亮小蠢品牌主色 */
    .btn-send.active,
    .btn-send:focus-visible {
      background: var(--primary-gradient);
      border-color: transparent;
      color: #fff;
      box-shadow: 0 4px 14px var(--primary-glow), inset 0 1px 1px rgba(255, 255, 255, 0.35);
    }

    .btn-send:hover {
      background: var(--primary-gradient);
      border-color: transparent;
      color: #fff;
      transform: scale(1.06);
      filter: brightness(1.08);
      box-shadow: 0 6px 18px rgba(234, 131, 119, 0.5);
    }

    .btn-send:active {
      transform: scale(0.95);
    }

    .btn-send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
      filter: grayscale(0.5);
      box-shadow: none !important;
    }

    .send-icon {
      width: 15px;
      height: 15px;
      transition: transform 0.2s ease;
    }

    .btn-send:hover .send-icon {
      transform: translateX(1px) translateY(-1px);
    }

    /* 正在思考 / 回复时的加载转圈 */
    .spinner {
      width: 15px;
      height: 15px;
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-top-color: var(--primary-light);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="app-container">
    <!-- 失败超时重试挂件（仅在加载超时时唤出） -->
    <div id="loading-overlay" class="hidden">
      <button class="retry-btn" id="btn-retry">🔄 重新连接小蠢 AI 伴侣</button>
    </div>

    <!-- 小蠢 AI 伴侣 iframe 嵌入 -->
    <iframe
      id="xiaochun-frame"
      allow="autoplay *; microphone *; autoplay; microphone"
      sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-downloads"
      loading="eager"
    ></iframe>

    <!-- 底部悬浮毛玻璃对话栏 (Project XiaoChun 品牌主题) -->
    <div id="chat-bar-container" class="chat-bar-container">
      <!-- 快捷提示药丸 (若尚未建立小蠢专属伙伴，提示一键创建) -->
      <div id="companion-tip-pill" class="tip-pill hidden">
        <span class="tip-icon">✨</span>
        <span class="tip-text" id="tip-text">生成专属「小蠢」伙伴</span>
        <button type="button" class="tip-action-btn" id="btn-create-teammate">立即添加</button>
        <button type="button" class="tip-close-btn" id="btn-close-tip" aria-label="关闭提示">×</button>
      </div>

      <form id="chat-form" class="chat-form" autocomplete="off">
        <input
          type="text"
          id="chat-input"
          class="chat-input"
          placeholder="和温柔可爱的小蠢聊聊天，按 Enter 发送..."
          maxlength="500"
        />
        <button type="submit" id="btn-send" class="btn-send" aria-label="发送消息" title="发送">
          <svg id="icon-send" class="send-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
          <div id="icon-loading" class="spinner" style="display: none;"></div>
        </button>
      </form>
    </div>
  </div>

  <script src="panel.js"></script>
</body>
</html>
