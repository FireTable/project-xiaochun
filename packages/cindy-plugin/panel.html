<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小蠢 AI 伴侣</title>
  <style>
    :root {
      --bg: #0f1117;
      --text: #f0f3f8;
      --text-muted: #8b949e;
      --primary: #ec4899;
      --primary-rgb: 236, 72, 153;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --text: #0f172a;
        --text-muted: #64748b;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--text);
    }

    #app-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* 3D 伴侣嵌入 iframe：100% 沉浸全屏 */
    #xiaochun-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: transparent;
    }

    /* 载入状态轻量遮罩（就绪后平滑淡出） */
    #loading-overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      gap: 14px;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }

    #loading-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(var(--primary-rgb), 0.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      letter-spacing: 0.3px;
    }

    .loading-sub {
      font-size: 11px;
      color: var(--text-muted);
    }

    .retry-btn {
      margin-top: 4px;
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      display: none;
      transition: all 0.15s ease;
    }

    .retry-btn:hover {
      background: rgba(var(--primary-rgb), 0.15);
      color: var(--primary);
    }

    .retry-btn.show {
      display: inline-block;
    }
  </style>
</head>
<body>
  <div id="app-container">
    <!-- 载入轻量过渡遮罩 -->
    <div id="loading-overlay">
      <div class="spinner"></div>
      <div class="loading-title">正在载入小蠢 AI 伴侣...</div>
      <div class="loading-sub">连接本地沙箱反向代理与 3D 渲染画布</div>
      <button class="retry-btn" id="btn-retry">🔄 重新连接</button>
    </div>

    <!-- 小蠢 AI 伴侣 iframe 嵌入 -->
    <iframe
      id="xiaochun-frame"
      allow="autoplay; microphone"
      sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-downloads"
      loading="eager"
    ></iframe>
  </div>

  <script src="panel.js"></script>
</body>
</html>
