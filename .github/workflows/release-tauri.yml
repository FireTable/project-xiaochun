name: Release Tauri App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Publish as a Draft Release'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (M1/M2/M3/M4)
          - platform: 'macos-14'
            target: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin'

          # macOS Intel (使用 macos-14 交叉编译 x86_64)
          - platform: 'macos-14'
            target: 'x86_64-apple-darwin'
            args: '--target x86_64-apple-darwin'

          # Windows x64
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            args: ''

          # Linux x64
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Linux 专有依赖
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: "${{ github.ref_type == 'tag' && github.ref_name || format('v0.1.0-preview.{0}', github.run_number) }}"
          releaseName: "${{ github.ref_type == 'tag' && format('Project XiaoChun {0}', github.ref_name) || format('Project XiaoChun v0.1.0-preview.{0}', github.run_number) }}"
          releaseBody: "See the release assets below for downloads on macOS, Windows, and Linux."
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: ${{ github.ref_type != 'tag' }}
          args: ${{ matrix.args }}

  update-homebrew:
    needs: release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update Homebrew Cask with release sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || format('v0.1.0-preview.{0}', github.run_number) }}"
          VERSION="${TAG#v}"
          echo "Updating homebrew/project-xiaochun.rb for version $VERSION ($TAG)..."

          RELEASE_JSON=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG")

          ARM_URL=$(echo "$RELEASE_JSON" | grep -o 'https://[^"]*aarch64[^"]*\.dmg' | head -n 1 || true)
          INTEL_URL=$(echo "$RELEASE_JSON" | grep -o 'https://[^"]*x64[^"]*\.dmg' | grep -v 'aarch64' | head -n 1 || true)

          if [ -n "$ARM_URL" ]; then
            echo "Downloading ARM DMG from $ARM_URL..."
            curl -sL "$ARM_URL" -o arm.dmg
            ARM_SHA256=$(sha256sum arm.dmg | awk '{print $1}')
            echo "ARM SHA256: $ARM_SHA256"
          else
            ARM_SHA256="SKIP"
          fi

          if [ -n "$INTEL_URL" ]; then
            echo "Downloading Intel DMG from $INTEL_URL..."
            curl -sL "$INTEL_URL" -o intel.dmg
            INTEL_SHA256=$(sha256sum intel.dmg | awk '{print $1}')
            echo "Intel SHA256: $INTEL_SHA256"
          else
            INTEL_SHA256="SKIP"
          fi

          if [ "$ARM_SHA256" != "SKIP" ] || [ "$INTEL_SHA256" != "SKIP" ]; then
            sed -i "s/version \".*\"/version \"$VERSION\"/" homebrew/project-xiaochun.rb
            if [ "$ARM_SHA256" != "SKIP" ]; then
              sed -i "s/sha256 arm:   \".*\"/sha256 arm:   \"$ARM_SHA256\"/" homebrew/project-xiaochun.rb
            fi
            if [ "$INTEL_SHA256" != "SKIP" ]; then
              sed -i "s/^[[:space:]]*intel: \".*\"/         intel: \"$INTEL_SHA256\"/" homebrew/project-xiaochun.rb
            fi

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add homebrew/project-xiaochun.rb
            if git diff --staged --quiet; then
              echo "No changes in homebrew cask formula."
            else
              git commit -m "chore(brew): auto-update homebrew cask to $VERSION [skip ci]" || true
              echo "Pushing updated homebrew cask to main..."
              git push origin HEAD:main || {
                echo "Warning: git push failed or target branch unavailable, skipping homebrew push."
                exit 0
              }
            fi
          else
            echo "No DMG assets found to update homebrew cask, skipping."
          fi
