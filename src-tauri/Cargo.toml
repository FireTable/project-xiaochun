[package]
name = "project-xiaochun"
version = "0.1.4"
description = "100% Client-Native Anime Companion & Transparent Desktop Pet"
authors = ["FireTable <firetable@foxmail.com>"]
license = "MIT"
repository = "https://github.com/FireTable/Project-XiaoChun"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "project_xiaochun_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-window-state = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
url = "2"

[features]
default = []
macos-private-api = ["tauri/macos-private-api"]

